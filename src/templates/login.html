<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar · Orquestador</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #16213e; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .caja { width: 100%; max-width: 360px; }
    .brand { color: #4fc3f7; font-weight: 700; }
  </style>
</head>
<body>
  <div class="caja">
    <div class="text-center mb-4 brand">
      <i class="bi bi-diagram-3-fill fs-2 d-block mb-1"></i>
      Tableau Prep<br><small class="fw-normal text-secondary">Orquestador</small>
    </div>
    <div class="card shadow">
      <div class="card-body p-4">
        <h6 class="fw-bold mb-3">Ingresar</h6>
        {% if error %}
        <div class="alert alert-danger py-2 small">{{ error }}</div>
        {% endif %}
        <form method="post" action="/login" autocomplete="on">
          <input type="hidden" name="next" value="{{ next }}">
          <div class="mb-2">
            <label class="form-label small fw-semibold mb-1" for="usuario">Usuario</label>
            <input class="form-control" id="usuario" name="usuario" autocomplete="username" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold mb-1" for="password">Contraseña</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Ingresar</button>
        </form>
      </div>
    </div>
    <p class="text-center text-secondary small mt-3">¿Te olvidaste la contraseña? Pedile a un admin que la resetee.</p>
  </div>
</body>
</html>
